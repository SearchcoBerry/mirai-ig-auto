name: Instagram 自動投稿

on:
  schedule:
    # 19:07 / 19:37 / 20:07 JST の3回起動する。GitHubの予約実行は遅れたり
    # 飛ばされたりすることがあるため。投稿は1日1件だけ（2回目以降は何もしない）
    - cron: "7 10 * * *"
    - cron: "37 10 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると投稿せず内容だけ表示します"
        type: boolean
        default: true
      force:
        description: "true にすると、今日すでに投稿済みでももう1件投稿します"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿する
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/images
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: python scripts/post.py

      - name: 投稿済みの記録をコミットする
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "投稿済みを記録"
            git push
          fi
