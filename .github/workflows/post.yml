name: Instagram 自動投稿

on:
  schedule:
    # 毎日 10:00 UTC = 19:00 JST（GitHub の都合で数分〜十数分遅れることがあります）
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると投稿せず内容だけ表示します"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿する
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/images
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/post.py

      - name: 投稿済みの記録をコミットする
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "投稿済みを記録"
            git push
          fi
